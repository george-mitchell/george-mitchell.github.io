title: "Quantum Computing"
tagline: "From one qubit to Shor's algorithm, quantum cryptography and error correction"
description: >-
  A mathematical, hands-on introduction to quantum computing for readers who know linear algebra and some Python; no physics is assumed.
  It runs from qubits and entanglement through the algorithms of Grover and Shor and their impact on cryptography to noise, quantum error correction and fault tolerance.
