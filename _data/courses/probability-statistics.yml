title: "Probability and Statistics"
tagline: "Prediction, inference and data, with calculus and R"
description: >-
  A visual, example-led first course in probability and statistics for students who know calculus.
  Every chapter is one interactive page with worked examples, real data and R code with its output.
summary: "25 lectures"
page: /probability-statistics/
folder: /assets/courses/probability-statistics/
order: 2
listed: true
