title: "Applied Bayesian Inference"
tagline: "Graphs, priors and posteriors for causal questions with real data"
description: >-
  A research-level course in applied Bayesian data analysis for readers who know basic probability, linear regression and some R.
  Every model starts from a causal graph and a simulated prior, is fitted in R with brms and Stan, checked, and written up to a publishable standard, on modern real data from public health, genomics, sport, education and AI.
summary: "33 lectures in 14 chapters, plus an afterword"
