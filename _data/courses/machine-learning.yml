title: "Machine Learning"
tagline: "From learning from data to transformers, reinforcement learning and research papers"
description: >-
  A visual, example-led course in machine learning for readers who know probability, statistics and some Python.
  Every lecture is one interactive page with intuition first, theorems with proofs, real data, Python code with its output,
  widgets to experiment with, and exercises and project ideas. By the end you can read current ML research papers.
summary: "23 lectures · 29 pages"
page: /machine-learning/
folder: /assets/courses/machine-learning/
cover: /assets/img/courses/machine-learning-cover.png
order: 5
listed: true
